version: 0.2

env:
  variables:
    SDLC_ENV: "dev"        # Override in CodeBuild environment variables (dev/qa/prod)
    TF_COMMAND: "apply"    # Override in CodeBuild environment variables (apply/destroy)
    TERRAFORM_VERSION: "1.10.5"

phases:
  install:
    runtime-versions:
      python: 3.11
    on-failure: ABORT
    commands:
      - echo Installing Terraform $TERRAFORM_VERSION...
      - wget https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
      - unzip -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip
      - mv terraform /usr/local/bin/
      - terraform -version

  pre_build:
    on-failure: ABORT
    commands:
      - echo Terraform execution started on $(date)

  build:
    on-failure: ABORT
    commands:
      - echo Switching to environment: $SDLC_ENV
      # Adjust this path to match your repo structure
      - cd "$CODEBUILD_SRC_DIR/$SDLC_ENV"
      - terraform init
      - terraform validate
      - terraform plan
      - terraform $TF_COMMAND -auto-approve

  post_build:
    on-failure: CONTINUE
    commands:
      - echo Terraform execution completed on $(date)
